name: Déploiement OVH

# Publie le site sur l'hébergement OVH à chaque modification, dès que les « secrets » sont renseignés
# (voir hosting/LISEZMOI.md). Sans secrets, ce workflow ne fait rien et ne bloque rien.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        if: env.HAS_FTP == 'true' || env.HAS_SSH == 'true'
        run: |
          pip install --quiet pillow
          python3 scripts/package.py

      - name: Envoyer par FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/site/
          server-dir: ${{ secrets.FTP_DIR || './www/' }}

      - name: Envoyer par SSH
        if: env.HAS_SSH == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH || 'www/' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" dist/site/ "$SSH_USER@$SSH_HOST:$SSH_PATH"

name: Déploiement OVH

# Publie le site sur l'hébergement OVH à chaque modification, dès que les « secrets » sont renseignés
# (voir hosting/LISEZMOI.md). Sans secrets, ce workflow ne fait rien et ne bloque rien.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
      HAS_SFTP: ${{ secrets.SFTP_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        if: env.HAS_FTP == 'true' || env.HAS_SFTP == 'true'
        run: |
          pip install --quiet pillow
          python3 scripts/package.py

      - name: Envoyer par FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/site/
          server-dir: ${{ secrets.FTP_DIR || './www/' }}

      - name: Envoyer par SFTP
        if: env.HAS_SFTP == 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || 'www/' }}
        run: |
          sudo apt-get install -y --no-install-recommends lftp >/dev/null
          OPTS="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30"
          if [ -n "$SFTP_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SFTP_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            OPTS="$OPTS; set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_deploy'"
          fi
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" \
            -e "$OPTS; mirror -R --no-perms --verbose dist/site/ $SFTP_DIR; bye"
